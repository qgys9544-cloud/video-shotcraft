name: PR checks

# Catches problems BEFORE merge that deploy-pages.yml would only surface after:
# generated artifacts (skills/video-shotcraft/gallery/source, library.json, index.html, sitemap,
# llms.txt) drifting from the shot cards, and library.json referencing preview
# MP4s that don't exist on the gallery-media release.
on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/video-shotcraft/references/shots/**'
      - 'skills/video-shotcraft/gallery/**'
      - 'skills/video-shotcraft/demos/**'
      - 'skills/video-shotcraft/assets/lib/**'
      - 'skills/video-shotcraft/assets/scripts/**'
      - 'skills/video-shotcraft/template/src/**'
      - 'skills/video-shotcraft/workbench/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

jobs:
  freesound-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freesound sourcing offline regressions
        run: python3 -m unittest discover -s skills/video-shotcraft/assets/scripts -p 'test_sfx_source.py' -v

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Helpers pure functions unit tests
        run: |
          npm ci
          npm test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generated artifacts are in sync with cards
        run: |
          python3 skills/video-shotcraft/gallery/sync-from-cards.py
          python3 skills/video-shotcraft/gallery/build-seo.py
          # git status --porcelain (not diff --exit-code): a brand-new card's
          # regenerated source copy is UNTRACKED, which diff can't see — that's
          # exactly the "added a card, forgot to commit the copy" mistake this
          # gate exists to catch.
          if [ -n "$(git status --porcelain -- skills/video-shotcraft/gallery)" ]; then
            git status --porcelain -- skills/video-shotcraft/gallery
            echo '::error::gallery artifacts drift from cards — run' \
                 'sync-from-cards.py + build-seo.py and commit the result'
            exit 1
          fi

      - name: Every library.json preview exists on the gallery-media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 与 deploy-pages 同一套组装（整包 zip + 晚于它的单个 mp4），查的是部署时真正拿到的文件
          python3 skills/video-shotcraft/gallery/assemble-media.py /tmp/gallery-media
          python3 - <<'EOF'
          import json, os, re, sys
          lib = json.load(open('skills/video-shotcraft/gallery/api/library.json'))
          assets = set(os.listdir('/tmp/gallery-media'))
          missing, malformed = [], []
          # app.js interpolates these URLs into innerHTML without escaping,
          # so gate the exact shape here: same-origin relative ./media/ path
          # only — no absolute/protocol-relative URLs, no quotes/angle brackets
          CANONICAL = re.compile(r'^\./media/[a-z0-9-]+\.(mp4|gif)(\?v=\d+)?$')
          for card in lib['cards']:
              for style in card['styles']:
                  media = style.get('media')
                  url = media.get('url') if isinstance(media, dict) else media
                  if not url:
                      continue
                  if not CANONICAL.match(url):
                      malformed.append(f"{card['name']}/{style['key']}: {url}")
                      continue
                  name = url.split('?')[0].rstrip('/').split('/')[-1]
                  if name not in assets:
                      missing.append(f"{card['name']}/{style['key']}: {name}")
          if malformed:
              print('::error::non-canonical media URLs (must be ./media/<name>.mp4?v=N):')
              print(*malformed, sep='\n  ')
              sys.exit(1)
          if missing:
              print('::error::previews missing from the gallery-media release:')
              print(*missing, sep='\n  ')
              sys.exit(1)
          print(f"all previews present on release "
                f"({len(lib['cards'])} cards checked)")
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/video-shotcraft/template/package-lock.json

      - name: Demo components compile (tsc strict)
        run: |
          cd skills/video-shotcraft/template && npm ci
          # 4 current demos + 2 legacy snapshots import @remotion/motion-blur, which the template
          # deliberately doesn't ship. Install it transiently, pinned to the
          # template's remotion version — a bare latest install nests a second
          # remotion copy and trips checkMultipleRemotionVersions.
          npm i --no-save "@remotion/motion-blur@$(node -p "require('./package.json').dependencies.remotion")"
          # skills/video-shotcraft/demos/ live outside skills/video-shotcraft/template/, so give tsc a module-resolution
          # root at the repo top via a transient symlink
          cd ../.. && ln -s skills/video-shotcraft/template/node_modules node_modules
          find demos -name '*.tsx' | sed 's|^|./|' > /tmp/demo-files.txt
          # skills/video-shotcraft/assets/lib components that only need remotion also get compiled.
          # (three-dependent ones — FlatPanel, helpers/camera — are excluded
          # because the template doesn't ship three.)
          for f in skills/video-shotcraft/assets/lib/ClipCard.tsx skills/video-shotcraft/assets/lib/Caption.tsx \
                   skills/video-shotcraft/assets/lib/DigitRoll.tsx skills/video-shotcraft/assets/lib/FlashCut.tsx \
                   skills/video-shotcraft/assets/lib/PageCam.tsx skills/video-shotcraft/assets/lib/VerticalTicker.tsx \
                   skills/video-shotcraft/assets/lib/helpers/motion.ts skills/video-shotcraft/assets/lib/helpers/rand.ts \
                   skills/video-shotcraft/assets/lib/helpers/shake.ts; do
            echo "./$f" >> /tmp/demo-files.txt
          done
          echo "checking $(wc -l < /tmp/demo-files.txt | tr -d ' ') tsx files"
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck \
            --esModuleInterop --jsx react-jsx --target es2022 \
            --module esnext --moduleResolution bundler --lib dom,es2022 \
            --resolveJsonModule \
            $(cat /tmp/demo-files.txt)

  workbench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/video-shotcraft/workbench/package-lock.json
      - name: Workbench type-checks and bundles with all demos linked in
        run: |
          cd skills/video-shotcraft/workbench
          # prepare hook builds the active index and the hidden compatibility index
          npm ci
          npx tsc -b
          npx vite build
      - name: Template (incl. workbench manifest) compiles against the workbench toolchain
        run: |
          # skills/video-shotcraft/template/ has no node_modules in CI; borrow the workbench's (same remotion / react pins)
          ln -s ../workbench/node_modules skills/video-shotcraft/template/node_modules
          cd skills/video-shotcraft/template && ../workbench/node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: Theme and palette regressions
        run: npm --prefix skills/video-shotcraft/workbench run test:themes
      - name: Export errors and Python interpreter regressions
        run: npm --prefix skills/video-shotcraft/workbench run test:platform
      - name: Retired demos remain compatible with saved projects
        run: npm --prefix skills/video-shotcraft/workbench run test:legacy

  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/video-shotcraft/template/package-lock.json
      - name: Render first frame of every runnable demo
        run: |
          cd skills/video-shotcraft/template && npm ci
          npm i --no-save "@remotion/motion-blur@$(node -p "require('./package.json').dependencies.remotion")"
          cd ../..
          # Generated smoke roots import demos outside skills/video-shotcraft/template/. Make the
          # template dependencies resolvable from those source directories.
          ln -s skills/video-shotcraft/template/node_modules node_modules
          python3 skills/video-shotcraft/assets/scripts/smoke-render-demos.py
